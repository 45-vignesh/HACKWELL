name: Sync with upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "MUTHUVELE/HACKWELL"
          destination_branch: "main"